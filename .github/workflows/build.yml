name: Build ESP32-C3 Firmware (PlatformIO)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # 可选：缓存 PlatformIO 的包和工具链，加速后续编译
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build for ESP32-C3
        run: |
          # 明确指定环境为 esp32-c3-devkitm-1，你也可以根据实际开发板修改
          pio run -e esp32-c3-devkitm-1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-firmware
          path: |
            .pio/build/esp32-c3-devkitm-1/firmware.bin
            .pio/build/esp32-c3-devkitm-1/partitions.bin
